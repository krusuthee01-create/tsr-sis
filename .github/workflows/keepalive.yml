name: กันฐานข้อมูลหยุดทำงาน (แพ็กเกจฟรี)

# Supabase แบบฟรีจะหยุดโปรเจกต์ถ้าไม่มีการใช้งาน 7 วัน (เช่น ช่วงปิดเทอม)
# งานนี้เรียกฐานข้อมูลทุกวัน เวลา 06:17 น. (เวลาไทย)
on:
  schedule:
    - cron: "17 23 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: เรียกฐานข้อมูล
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/grade_levels?select=code&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          test "$code" = "200"
