name: สำรองข้อมูลรายสัปดาห์

# สำรองฐานข้อมูลทุกวันอาทิตย์ 02:23 น. (เวลาไทย) เข้ารหัสด้วย BACKUP_PASSPHRASE
# แล้วเก็บเป็นไฟล์แนบของ workflow 90 วัน (ดาวน์โหลดได้ที่แท็บ Actions)
on:
  schedule:
    - cron: "23 19 * * 6"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: ติดตั้ง pg_dump 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      - name: สำรองและเข้ารหัส
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$SUPABASE_DB_URL" && test -n "$BACKUP_PASSPHRASE"
          name="tsr-sis-$(TZ=Asia/Bangkok date +%Y-%m-%d)"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --schema=public --schema=auth --no-owner --no-privileges -Fc -f "$name.dump"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 -o "$name.dump.gpg" "$name.dump"
          rm "$name.dump"
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: สำรองรูปเยี่ยมบ้านและลายเซ็นสารบรรณ (ทำเมื่อตั้ง SUPABASE_URL และ SUPABASE_SERVICE_ROLE_KEY ไว้)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "ข้ามการสำรองรูป: ยังไม่ได้ตั้ง secret SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY"
            exit 0
          fi
          node repo/scripts/backup-storage.mjs photos
          tar -czf "$NAME-photos.tar.gz" -C photos .
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 -o "$NAME-photos.tar.gz.gpg" "$NAME-photos.tar.gz"
          rm -rf photos "$NAME-photos.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}*.gpg
          retention-days: 90
