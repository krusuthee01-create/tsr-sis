name: ตรวจสอบโค้ด

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - name: ทดสอบฐานข้อมูลและสิทธิ์ (RLS)
        run: |
          set -o pipefail
          tests/sql/run.sh -h localhost -U postgres 2>&1 | tee sql-test.log || {
            grep -E "ERROR|error|FATAL" sql-test.log | head -5 | sed 's/^/::error::/'
            exit 1
          }
        env:
          PGPASSWORD: postgres
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
